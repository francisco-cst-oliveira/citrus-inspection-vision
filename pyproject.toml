[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "citrus-inspection-vision"
version = "0.2.0"
description = "Runtime and analytics pipeline for citrus surface inspection."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Francisco Oliveira" }]
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.9,<5",
  "scipy>=1.11,<2",
  "pyyaml>=6.0,<7",
  "typer>=0.12,<1",
  "rich>=13,<15",
]

[project.optional-dependencies]
inference = ["torch>=2.2,<3"]
dev = ["pytest>=8,<10", "ruff>=0.5,<1"]

[project.scripts]
citrus-inspect = "citrus_inspection.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"src/citrus_inspection/cli.py" = ["B008"]

